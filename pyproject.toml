[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "design-pipeline"
version = "0.1.0"
description = "A provider-neutral, requirements-driven software design pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pypdf>=4.0",
    "PyYAML>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
postgres = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]
mermaid = [
    "mcp>=2.0",
]

[project.scripts]
design = "design_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/design_pipeline"]
include = ["src/design_pipeline/review_app/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
